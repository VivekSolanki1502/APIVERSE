name = "apiverse"
main = "cloudflare/worker.ts"
compatibility_date = "2026-10-19"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "apiverse"
database_id = "0b72a604-aed3-4526-8661-d27a773f927b"
migrations_dir = "cloudflare/migrations"

[triggers]
crons = ["17 0 * * *"]
