    <script>
      // Apply the saved theme before first paint to avoid a flash. Dark is the default.
      try {
        var t = localStorage.getItem('apiverse:theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {}
