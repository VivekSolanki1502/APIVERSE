name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Catalog validation (schema, duplicate ids, required docs, URL format)
        run: npm run validate:catalog
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Backend type check
        run: npm run backend:typecheck
      - name: Cloudflare Worker type check
        run: npm run worker:typecheck
      - name: Unit tests
        run: npm test
      - name: Backend integration tests
        run: npm run test:backend
      - name: Production build
        run: npm run build
      - name: Cloudflare Worker bundle
        run: npm run worker:dry-run
      - name: Backend production bundle
        run: npm run backend:build
